#:schema https://staging.catalystcloud.dev/schemas/catalyst.schema.json
# This repository belongs to the CTC Catalyst project, whose home repository is coalesce-labs/catalyst-cloud.

[project]
linear_team = "CTC"

[merge]
policy = "codex-attestation-strict"

# The same install and checks the ci.yml pull request gate runs. The evals job is left out: it needs an Anthropic key and a Claude Code install.
[environment]
toolchains = [{ name = "node", version = "22" }, { name = "bun", version = "1.3.14" }]

[[environment.setup]]
name = "install-dependencies"
run = ["sh", "-lc", "bun install --frozen-lockfile"]
timeout_seconds = 900
cache_key_files = ["bun.lock"]

[environment.container]
git = { submodules = false, lfs = false }

[[environment.verify]]
name = "release-check"
run = ["sh", "-lc", "bun run release:check"]

[[environment.verify]]
name = "typecheck"
run = ["sh", "-lc", "bun run typecheck"]

[[environment.verify]]
name = "vendored-copies"
run = ["sh", "-lc", "bun run settings:check && bun run self-host:check"]

[[environment.verify]]
name = "test"
run = ["sh", "-lc", "bun run test"]
timeout_seconds = 1800

[[environment.verify]]
name = "build"
run = ["sh", "-lc", "bun run build"]

[[environment.verify]]
name = "skills-scan"
run = ["sh", "-lc", "bun run skills:scan"]
