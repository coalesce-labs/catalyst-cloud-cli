name: ci

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.derive.outputs.node }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # CTC-2158 / Ryan 2026-09-17: "current plus active LTS, matrix derived from engines". The list
      # is DERIVED here, never hand-written — raising engines.node is the only edit that changes it.
      # CTC-8223: an ordinary pull request checks one major, the Active LTS one (`--pull-request`).
      # A push to main and a merge-queue head (mergify/merge-queue/) still check every major, so a
      # break on another supported major is caught before it merges. Mergify gates on `check`,
      # which needs whichever matrix jobs ran, so no required status waits for a job that never runs.
      - id: derive
        env:
          ONE_MAJOR: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/') }}
        run: |
          flag=""
          if [ "$ONE_MAJOR" = "true" ]; then flag="--pull-request"; fi
          echo "node=$(node scripts/node-support-matrix.mjs --json $flag)" >> "$GITHUB_OUTPUT"

  check-node:
    name: check (node ${{ matrix.node }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.matrix.outputs.node) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Release train
        run: bun run release:check

      # CTC-6443 — the publish workflow refuses a release whose release-train.json differs from the
      # deployed cloud's, and that refusal used to be the first anyone heard of the drift (0.16.22,
      # 0.16.24). `--dry-run` runs the same comparison without needing a release tag.
      - name: Release declaration matches the deployed cloud
        run: |
          if ! out=$(node scripts/release-train-check.mjs --publish cli --dry-run 2>&1); then
            echo "::error::$out"
            if [[ "$out" == *"differs from canonical"* ]]; then
              echo "::error::Copy https://staging.catalystcloud.dev/release-train.json: its line, state, approval or members changed (CTC-6446: it names no member patch)."
            fi
            exit 1
          fi
          echo "$out"

      - name: Typecheck
        run: bun run typecheck

      - name: Shared settings validator provenance
        run: bun run settings:check

      - name: Self-hosted runner Compose provenance
        run: bun run self-host:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # ⛔ The suite itself CANNOT see this. Measured 2026-09-17: inside `bun run test`,
      # process.execPath is the real node setup-node installed and process.versions.bun is ABSENT,
      # because vitest's bin carries `#!/usr/bin/env node` and `bun run` delegates to it. Every test
      # that spawns the built CLI uses process.execPath, so the Node the CLI runs under is the Node
      # vitest runs under — never a second major. This step is the only thing that runs the built CLI
      # on THIS matrix major, which is the exact regression Tony hit on Node 26.
      - name: The built CLI loads the SDK on Node ${{ matrix.node }}
        run: |
          set -euo pipefail
          out="$(node bin/catalyst-skills.js ready || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q '^ok .*sdk: loads' \
            || { echo "::error title=SDK did not load on Node ${{ matrix.node }}::$out"; exit 1; }

      - uses: astral-sh/setup-uv@v7

      # CTC-2012 Tier 1b — the deterministic half of skill-scanner: no credential, no live model,
      # runs on every PR and every push to main. Fails on any finding not written down in
      # scripts/skill-scanner-accepted.json.
      - name: Skill scanner over skills/
        run: bun run skills:scan

  # CTC-2012 Tier 1a — the scored half. `claude plugin eval . --no-publish` runs `--runs 1` (or
  # more, per skill) `claude -p` sessions that spend a real credential, so it is a separate job
  # from `check`, gated to paths that could actually change routing, and never fails the job over
  # a credential nobody has minted yet — see scripts/run-evals.mjs and evals/README.md.
  evals:
    name: Skill routing evals
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install (frozen)
        run: bun install --frozen-lockfile

      - name: Install the Claude Code CLI
        run: bun add -g @anthropic-ai/claude-code

      - name: Assert a CLI new enough for --json result documents
        run: |
          set -euo pipefail
          version="$(claude --version | awk '{print $1}')"
          IFS=. read -r major minor patch <<<"$version"
          if [ "$major" -lt 2 ] || { [ "$major" -eq 2 ] && [ "$minor" -lt 1 ]; } || { [ "$major" -eq 2 ] && [ "$minor" -eq 1 ] && [ "$patch" -lt 224 ]; }; then
            echo "::error title=plugin eval::claude $version is older than the 2.1.224 minimum for --json result documents" >&2
            exit 1
          fi
          echo "claude $version"

      # ⛔ WARNS LOUDLY, NEVER FAILS OPEN SILENTLY — same pattern as notify-catalyst-cloud below.
      # Two independent reasons this step can decide there is nothing scored to prove today: (1) the
      # diff does not touch anything plugin-eval could catch (60 agent runs on a README typo is
      # waste — the deterministic gate in the `check` job runs regardless of this filter), or (2)
      # either secret this job needs is unset. Either way this must never fail the build, and must
      # never report green having evaluated nothing — it names exactly which is true.
      - name: Run the scored eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_FOR_EVALS }}
          CLAUDE_CODE_WALNUT_SPIRE: ${{ secrets.CLAUDE_CODE_PLUGIN_EVAL_ENABLEMENT }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            if ! git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -qE '^(skills/|evals/|\.claude-plugin/)'; then
              echo "::notice title=skill evals skipped::Nothing under skills/, evals/ or .claude-plugin/ changed in this diff, so the scored suite did not run. The deterministic gate (test/evals-suite.test.ts, in the check job) always runs regardless."
              exit 0
            fi
          fi
          if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${CLAUDE_CODE_WALNUT_SPIRE:-}" ]; then
            echo "::warning title=skill evals not wired::No skill was actually asked to trigger in this run. ANTHROPIC_API_KEY_FOR_EVALS and/or CLAUDE_CODE_PLUGIN_EVAL_ENABLEMENT are unset, so the scored 'claude plugin eval' suite did not run. The deterministic half (test/evals-suite.test.ts) DID run and still holds every description to its cases. Add both secrets to close this gap."
            exit 0
          fi
          bun run evals

  bun-runtime:
    needs: check-node
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.3.14 has no node:sqlite (measured: `bun -e 'import "node:sqlite"'` -> could not resolve);
        # latest has it. Both directions are asserted, because the FAILING one is what a customer hits.
        include:
          - bun: 1.3.14
            expect: friendly-refusal
          - bun: latest
            expect: sdk-loads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: The built CLI under bun ${{ matrix.bun }} (${{ matrix.expect }})
        run: |
          set -euo pipefail
          out="$(bun bin/catalyst-skills.js ready 2>&1 || true)"
          printf '%s\n' "$out"
          case "${{ matrix.expect }}" in
            sdk-loads)
              printf '%s\n' "$out" | grep -q '^ok .*sdk: loads' ;;
            friendly-refusal)
              # It must name bun, name the floor, print the one command — and NEVER leak the raw
              # ResolveMessage the launcher used to print before CTC-2158.
              printf '%s\n' "$out" | grep -q 'bun 1\.3\.14' \
                && printf '%s\n' "$out" | grep -q 'runtime install' \
                && ! printf '%s\n' "$out" | grep -q 'ResolveMessage' ;;
          esac

  # The one gate name Mergify reads (`check-success=check` in .mergify.yml). A matrixed job reports
  # as `check (node 24)` and so on, never as bare `check`, so without this job the queue would wait
  # forever. It is green only when every Node major and both bun directions are green.
  check:
    needs: [check-node, bun-runtime]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Node major and every bun direction passed
        run: |
          echo "check-node=${{ needs.check-node.result }} bun-runtime=${{ needs.bun-runtime.result }}"
          test "${{ needs.check-node.result }}" = success
          test "${{ needs.bun-runtime.result }}" = success

  # CTC-2534 — tell catalyst-cloud that the bundle moved, so its vendored `.well-known` index stops
  # lagging. It lagged 27 commits and a whole skill (`unstick`) before this existed, and served a
  # `connect-me` description naming the WRONG KEY TIER — copy that is actively wrong rather than
  # merely absent, and cannot self-heal.
  #
  # ⛔ WHY HERE AND NOT IN publish.yml. catalyst-cloud's sync reads this repo's DEFAULT BRANCH HEAD
  # (`sync-skills-bundle-manifest.ts` resolves `default_branch` then takes `head.sha`), so drift is
  # created by pushes to main. `publish.yml` runs on TAGS only, so a sender there would miss every
  # main push between releases — which is exactly the window the index has been lagging in. The
  # deferred-trigger comment in catalyst-cloud names "the bundle repo's own publish workflow"; that
  # is the right repo and the wrong workflow, and this is the difference.
  notify-catalyst-cloud:
    name: Tell catalyst-cloud the bundle moved
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # ⛔ WARNS LOUDLY, NEVER FAILS OPEN SILENTLY. The dispatch token is a cross-repo credential
      # that does not exist yet — `github.token` is scoped to THIS repo and cannot fire a
      # repository_dispatch at catalyst-cloud. Until a human mints it, this step says so on every
      # main push rather than reporting success and re-hiding the drift. A missing secret is a
      # visible gap; a swallowed one is the same silence this job exists to end.
      - name: Dispatch skills-bundle-published
        env:
          DISPATCH_TOKEN: ${{ secrets.CATALYST_CLOUD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning title=skills-bundle sync not wired::CATALYST_CLOUD_DISPATCH_TOKEN is not set, so catalyst-cloud was NOT told the bundle moved. Its .well-known index will lag until someone runs 'bun run skills-bundle:sync' by hand. Mint a token with repository_dispatch rights on coalesce-labs/catalyst-cloud and add it as this repo's CATALYST_CLOUD_DISPATCH_TOKEN."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/coalesce-labs/catalyst-cloud/dispatches \
            -d '{"event_type":"skills-bundle-published"}')
          if [ "$code" != "204" ]; then
            echo "::error title=skills-bundle dispatch failed::GitHub answered ${code}; catalyst-cloud was not told the bundle moved."
            cat /tmp/dispatch.out
            exit 1
          fi
          echo "::notice::dispatched skills-bundle-published to coalesce-labs/catalyst-cloud"
