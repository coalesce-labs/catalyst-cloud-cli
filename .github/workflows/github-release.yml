# CTC-9044 — create the GitHub Release for CLI versions that shipped before publish.yml made one
# (0.16.42 to 0.16.44 when this was added). It only creates Releases: nothing is built or published
# to npm. Each tag's notes come from that tag's own CHANGELOG.md, and a tag that already has a
# Release is left alone. publish.yml creates the Release for every new tag by itself.
name: GitHub Release backfill

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated release tags, oldest first (for example skills-bundle-v0.16.42 skills-bundle-v0.16.43).
        required: true
        type: string
      dry_run:
        description: Print the Releases and their notes without creating them.
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Create the GitHub Releases
        run: |
          set -euo pipefail
          args=()
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          read -r -a tags <<< "$TAGS"
          node scripts/github-release.mjs "${tags[@]}" "${args[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
          DRY_RUN: ${{ inputs.dry_run }}
