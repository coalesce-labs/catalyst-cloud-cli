# Installed Darwin custody channels. Include with compose.yaml only after native producer setup.
# The signing key and producer configuration remain on the native host, outside every mount.
services:
  supervisor:
    environment:
      CATALYST_THOUGHTS_CUSTODY_AUTHORITY: ${CATALYST_THOUGHTS_CUSTODY_AUTHORITY:?set installed Darwin authority}
    volumes:
      - type: bind
        source: ${CATALYST_THOUGHTS_CUSTODY_REQUESTS_DIR:?set installed Darwin requests root}
        target: ${CATALYST_THOUGHTS_CUSTODY_REQUESTS_DIR:?set installed Darwin requests root}
        bind:
          create_host_path: false
      - type: bind
        source: ${CATALYST_THOUGHTS_CUSTODY_RESPONSES_DIR:?set installed Darwin responses root}
        target: ${CATALYST_THOUGHTS_CUSTODY_RESPONSES_DIR:?set installed Darwin responses root}
        read_only: true
        bind:
          create_host_path: false
